interface:
  display_name: "Stock Analysis"
  short_description: "SOP-driven stock analysis suite — analytical sections, investor personas, debate, and backtest in one skill"
  default_prompt: "Analyze a stock. If unclear, ask for report depth (basic / standard / full SOP), objective (target price / short-term trade / medium-term strategy / long-term investment / earnings review), position budget, and — for full SOP — whether the multi-agent debate uses investor personas. The report is always delivered as a self-contained HTML file (format is not asked). To run a single module or a persona directly, name it in the prompt (e.g. 'just the technical module on NVDA' or 'analyze NVDA through Buffett's lens'). To run a debate, ask for one (e.g. 'Buffett vs Wood debate on TSLA, 2 rounds'). To backtest, name mode + strategy/persona/signal (e.g. 'backtest NVDA KDJ golden cross 2020-2025')."
